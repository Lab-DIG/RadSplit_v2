[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "radsplit"
version = "1.0.0"
description = "Audit and create patient, scanner, and kernel level data partitions for radiology AI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sandeep Bodduluri" }]
keywords = ["radiology", "medical imaging", "data leakage", "data partitioning", "machine learning"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "tabulate>=0.9",
  "typer>=0.12",
]

[project.optional-dependencies]
manifest = ["pydicom>=2.4", "nibabel>=5.1", "pyarrow>=14", "SimpleITK>=2.3"]
plot = ["matplotlib>=3.8"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "ruff>=0.5",
  "matplotlib>=3.8",
  "pydicom>=2.4",
  "nibabel>=5.1",
  "pyarrow>=14",
  "SimpleITK>=2.3",
  "scikit-learn>=1.4",
]
analysis = [
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "graphviz>=0.20",
  "torch>=2.2",
  "torchxrayvision>=1.2",
  "idc-index-data==24.2.2",
  "pillow>=10",
  "pyarrow>=14",
]

[project.scripts]
radsplit = "radsplit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["radsplit"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
python_files = ["test*.py"]

[tool.coverage.run]
source = ["radsplit"]
branch = true

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP045", "UP007", "B008", "B905", "E731"]
